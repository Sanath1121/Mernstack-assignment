<html>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .title {
            margin-bottom: 30px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        
        .main-layout {
            display: flex;
            gap: 30px;
        }
        
        .sidebar {
            width: 400px;
            flex-shrink: 0;
        }
        
        .sidebar-box {
            background-color: #4169e1;
            color: white;
            padding: 30px;
            border-radius: 4px;
            padding-top: 20px;
        }
        
        .sidebar-box h2 {
            font-size: 24px;
            font-weight: normal;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .sidebar-box ul {
            list-style: none;
        }
        
        .sidebar-box li {
            margin: 10px 0;
            font-size: 16px;
        }
        
        .sidebar-box a {
            color: white;
            text-decoration: none;
        }
        
        .sidebar-box a:hover {
            text-decoration: underline;
        }
        
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        
        .city-box {
            background-color: #4169e1;
            color: white;
            padding: 30px;
            border-radius: 4px;
        }
        
        .city-box h2 {
            font-size: 28px;
            font-weight: normal;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .images {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .images img {
            width: 100px;
            height: 100px;
            background-color: white;
            padding: 5px;
            border-radius: 2px;
        }
        
        .city-description {
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
    <body>
        <h2>Hyderabad</h2>
                    <div class="images">
                        <img src="./assets/cat.png" alt="Img 1">
                        <img src="./assets/cat.png" alt="Img 2">
                        <img src="./assets/cat.png" alt="Img 3">
                    </div>
                    <div class="city-description">
                        <p>Write 2 paragraphs to describe the city</p>
                    </div>
</html>
